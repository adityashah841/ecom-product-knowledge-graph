data:
  dataset_name: "amazon_esci"
  sample_size: 75000          # sample from full dataset
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_seq_length: 128
  seed: 42

ner:
  model_name: "bert-base-uncased"
  batch_size: 16
  learning_rate: 0.00002
  num_epochs: 5
  warmup_steps: 200
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  label_list:
    - "O"
    - "B-BRAND"
    - "I-BRAND"
    - "B-PRODUCT"
    - "I-PRODUCT"
    - "B-CATEGORY"
    - "I-CATEGORY"
    - "B-ATTRIBUTE"
    - "I-ATTRIBUTE"
    - "B-COLOR"
    - "I-COLOR"
    - "B-MATERIAL"
    - "I-MATERIAL"

matching:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32
  learning_rate: 0.00002
  num_epochs: 3
  similarity_threshold: 0.85
  fp16: true

semi_supervised:
  confidence_threshold: 0.90
  max_iterations: 3
  expansion_batch_size: 500

distillation:
  teacher_model: "bert-base-uncased"
  student_model: "distilbert-base-uncased"
  temperature: 4.0
  alpha: 0.7                  # weight of distillation loss vs hard label loss
  batch_size: 8
  learning_rate: 0.00005
  num_epochs: 4
  fp16: true
  gradient_checkpointing: true

graph:
  min_entity_confidence: 0.85
  max_nodes: 50000
  visualization_sample: 500   # nodes to show in HTML visualization

paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  models: "models/"
  results: "results/"
  samples: "data/samples/"
